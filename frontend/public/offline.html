<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#155c47" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />
    <title>OpenScholar unavailable</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #f4f1e8;
        color: #17231d;
        display: grid;
        margin: 0;
        min-height: 100vh;
        padding: 28px;
      }

      main {
        margin: auto;
        max-width: 680px;
        width: 100%;
      }

      .brand {
        align-items: center;
        display: flex;
        gap: 12px;
        margin-bottom: 28px;
      }

      .mark {
        background: #155c47;
        border-radius: 13px;
        color: #fffdf8;
        display: grid;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 26px;
        font-weight: 700;
        height: 48px;
        place-items: center;
        width: 48px;
      }

      .brand strong {
        display: block;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.35rem;
      }

      .brand small,
      .eyebrow {
        color: #526057;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      section {
        background: #fffdf8;
        border: 1px solid #d9d6cc;
        border-radius: 24px;
        box-shadow: 0 16px 44px rgb(23 35 29 / 9%);
        padding: clamp(28px, 7vw, 56px);
      }

      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.3rem, 10vw, 4.4rem);
        letter-spacing: -0.045em;
        line-height: 0.98;
        margin: 12px 0 20px;
      }

      p {
        color: #526057;
        font-size: 1.05rem;
        line-height: 1.65;
        margin: 0 0 28px;
      }

      a {
        background: #155c47;
        border-radius: 10px;
        color: #fffdf8;
        display: inline-block;
        font-weight: 700;
        padding: 12px 18px;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #b7da73;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-label="OpenScholar">
        <span class="mark" aria-hidden="true">O</span>
        <span>
          <strong>OpenScholar</strong>
          <small>Research, with sources</small>
        </span>
      </div>
      <section>
        <span class="eyebrow">Connection unavailable</span>
        <h1>OpenScholar can’t be reached.</h1>
        <p>
          Check your connection, then try again to search research or update
          your saved library. No paper documents are stored for offline reading.
        </p>
        <a href="/">Try again</a>
      </section>
    </main>
  </body>
</html>
