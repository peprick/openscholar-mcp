        - accessStatus
        - versionType
        - hostType
        - landingPageUrl
        - pdfUrl
        - hostDomain
        - license
        - evidence
        - contentHandling
        - verificationStatus
        - verificationHttpStatus
        - verificationContentType
        - verificationFailureCode
        - providerUpdatedAt
        - retrievedAt
        - lastSeenAt
        - verifiedAt
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        source:
          type: string
          enum: [UNPAYWALL, ARXIV]
        best:
          type: boolean
        accessStatus:
          $ref: "#/components/schemas/AccessStatus"
        versionType:
          $ref: "#/components/schemas/AccessVersionType"
        hostType:
          $ref: "#/components/schemas/AccessHostType"
        landingPageUrl:
          $ref: "#/components/schemas/NullableUri"
        pdfUrl:
          $ref: "#/components/schemas/NullableUri"
          description: Independently selected and verified candidate, never proxied by the API.
        hostDomain:
          $ref: "#/components/schemas/NullableString"
        license:
          $ref: "#/components/schemas/NullableString"
        evidence:
          $ref: "#/components/schemas/NullableString"
        contentHandling:
          $ref: "#/components/schemas/ContentHandlingMode"
        verificationStatus:
          $ref: "#/components/schemas/AccessVerificationStatus"
        verificationHttpStatus:
          type: [integer, "null"]
          format: int32
          minimum: 100
          maximum: 599
        verificationContentType:
          $ref: "#/components/schemas/NullableString"
        verificationFailureCode:
          type: [string, "null"]
          maxLength: 64
        providerUpdatedAt:
          $ref: "#/components/schemas/NullableInstant"
        retrievedAt:
          $ref: "#/components/schemas/Instant"
        lastSeenAt:
          $ref: "#/components/schemas/Instant"
        verifiedAt:
          $ref: "#/components/schemas/NullableInstant"
      additionalProperties: false

    BatchCitationRequest:
      type: object
      required: [paperIds, format]
      properties:
        paperIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Uuid"
          description: Distinct paper IDs retained in caller order.
        format:
          $ref: "#/components/schemas/CitationFormat"
      additionalProperties: false
    CslJsonCitationArray:
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: "#/components/schemas/CslJsonCitationItem"
    CslJsonCitationItem:
      type: object
      required: [id, type, citation-key, title]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        type:
          type: string
          enum:
            - article-journal
            - article
            - paper-conference
            - thesis
            - book
            - chapter
            - report
            - dataset
            - document
        citation-key:
          type: string
        title:
          type: string
        abstract:
          type: string
        author:
          type: array
          items:
            type: object
            required: [literal]
            properties:
              literal:
                type: string
            additionalProperties: false
        container-title:
          type: string
        publisher:
          type: string
        volume:
          type: string
        issue:
          type: string
        page:
          type: string
        edition:
          type: string
        ISBN:
          type: string
        ISSN:
          type: string
        genre:
          type: string
        custom:
          type: object
          properties:
            openscholar-venue:
              type: string
            openscholar-institution:
              type: string
            openscholar-article-number:
              type: string
          additionalProperties: false
        issued:
          $ref: "#/components/schemas/CslIssuedDate"
        language:
          type: string
        DOI:
          type: string
        URL:
          type: string
          format: uri
        archive:
          type: string
          const: arXiv
        archive_location:
          type: string
        PMID:
          type: string
        PMCID:
          type: string
      additionalProperties: false
    CslIssuedDate:
      type: object
      required: [date-parts]
      properties:
        date-parts:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: array
            minItems: 1
            maxItems: 3
            prefixItems:
              - type: integer
                minimum: 0
              - type: integer
                minimum: 1
                maximum: 12
              - type: integer
                minimum: 1
                maximum: 31
      additionalProperties: false

    CollectionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '\S'
          description: Whitespace is collapsed before persistence.
        description:
          type: [string, "null"]
          maxLength: 1000
          description: Whitespace is collapsed; blank becomes null.
      additionalProperties: false
    SavedPaperRequest:
      type: object
      required: [readingStatus, tags]
      properties:
        readingStatus:
          $ref: "#/components/schemas/ReadingStatus"
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 40
            pattern: '\S'
          description: Tags are whitespace-collapsed and lowercased; normalized duplicates are rejected and responses are sorted.
      additionalProperties: false
    CollectionSummary:
      type: object
      required: [collectionId, name, description, paperCount, createdAt, updatedAt]
      properties:
        collectionId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, "null"]
          maxLength: 1000
        paperCount:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
      additionalProperties: false
    CollectionDetails:
      type: object
      required: [collectionId, name, description, paperCount, createdAt, updatedAt, papers]
      properties:
        collectionId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, "null"]
          maxLength: 1000
        paperCount:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
        papers:
          $ref: "#/components/schemas/SavedPaperPage"
      additionalProperties: false
    SavedPaper:
      type: object
      required:
        - collectionId
        - collectionName
        - paperId
        - title
        - authors
        - publicationYear
        - documentType
        - readingStatus
        - tags
        - savedAt
        - updatedAt
      properties:
        collectionId:
          $ref: "#/components/schemas/Uuid"
        collectionName:
          type: string
        paperId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        publicationYear:
          $ref: "#/components/schemas/NullableInteger"
        documentType:
          $ref: "#/components/schemas/DocumentType"
        readingStatus:
          $ref: "#/components/schemas/ReadingStatus"
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 40
        savedAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
      additionalProperties: false
    CollectionPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CollectionSummary"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
      additionalProperties: false
    SavedPaperPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/SavedPaper"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
      additionalProperties: false

    CreateRefreshJobRequest:
      type: object
