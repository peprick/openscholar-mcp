    DeletePersonalDataRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          const: DELETE_MY_DATA
      additionalProperties: false
    PrivacyExport:
      type: object
      required:
        - userId
        - displayName
        - accountCreatedAt
        - generatedAt
        - searches
        - collections
        - savedPapers
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        displayName:
          type: string
        accountCreatedAt:
          $ref: "#/components/schemas/Instant"
        generatedAt:
          $ref: "#/components/schemas/Instant"
        searches:
          type: array
          items:
            $ref: "#/components/schemas/PrivacySearch"
        collections:
          type: array
          items:
            $ref: "#/components/schemas/PrivacyCollection"
        savedPapers:
          type: array
          items:
            $ref: "#/components/schemas/PrivacySavedPaper"
      additionalProperties: false
    PrivacySearch:
      type: object
      required: [searchId, query, filters, searchedAt, freshUntil, resultCount, warnings]
      properties:
        searchId:
          $ref: "#/components/schemas/Uuid"
        query:
          type: string
        filters:
          $ref: "#/components/schemas/PrivacySearchFilters"
        searchedAt:
          $ref: "#/components/schemas/Instant"
        freshUntil:
          $ref: "#/components/schemas/Instant"
        resultCount:
          type: integer
          format: int32
          minimum: 0
        warnings:
          type: array
          items:
            type: string
      additionalProperties: false
    PrivacySearchFilters:
      type: object
      required:
        - yearFrom
        - yearTo
        - documentTypes
        - openAccessOnly
        - minimumCitations
        - languages
        - pageSize
      properties:
        yearFrom:
          type: [integer, "null"]
          format: int32
          minimum: 1000
          maximum: 9999
        yearTo:
          type: [integer, "null"]
          format: int32
          minimum: 1000
          maximum: 9999
        documentTypes:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DocumentType"
        openAccessOnly:
          type: boolean
        minimumCitations:
          type: integer
          format: int32
          minimum: 0
        languages:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z]{2,3}$'
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
      additionalProperties: false
    PrivacyCollection:
      type: object
      required: [collectionId, name, description, createdAt, updatedAt]
      properties:
        collectionId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, "null"]
          maxLength: 1000
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
      additionalProperties: false
    PrivacySavedPaper:
      type: object
      required:
        - collectionId
        - paperId
        - title
        - readingStatus
        - tags
        - savedAt
        - updatedAt
      properties:
        collectionId:
          $ref: "#/components/schemas/Uuid"
        paperId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
        readingStatus:
          $ref: "#/components/schemas/ReadingStatus"
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 40
        savedAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
      additionalProperties: false
