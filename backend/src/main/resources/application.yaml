spring:
  application:
    name: openscholar-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/openscholar}
    username: ${POSTGRES_USER:openscholar}
    password: ${POSTGRES_PASSWORD:openscholar}
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}
      lifecycle-management: start-only
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

openscholar:
  access:
    link-verification:
      allow-http: false
      max-redirects: 4
      connect-timeout: 3s
      request-timeout: 10s
      max-probe-bytes: 4096
  providers:
    openalex:
      base-url: ${OPENALEX_BASE_URL:https://api.openalex.org}
      api-key: ${OPENALEX_API_KEY:}
      connect-timeout: 3s
      read-timeout: 15s
  search:
    cache-ttl: 24h

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Open-access research discovery and MCP backend
    java-version: ${java.version}
