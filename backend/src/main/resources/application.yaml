spring:
  application:
    name: openscholar-backend
  ai:
    mcp:
      server:
        protocol: STATELESS
        type: SYNC
        name: openscholar-mcp
        version: 0.0.1
        instructions: >-
          Search scholarly metadata, inspect canonical papers and verified legal-access
          locations, query the local saved library, and export citations. The server never
          bypasses publisher authentication or returns restricted document bytes.
        request-timeout: 20s
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        tool-change-notification: false
        resource-change-notification: false
        prompt-change-notification: false
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /mcp
          disallow-delete: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/openscholar}
    username: ${POSTGRES_USER:openscholar}
    password: ${POSTGRES_PASSWORD:openscholar}
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}
      lifecycle-management: start-only
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

openscholar:
  security:
    oidc:
      enabled: ${OIDC_SECURITY_ENABLED:false}
      issuer-uri: ${OIDC_ISSUER_URI:}
      jwk-set-uri: ${OIDC_JWK_SET_URI:}
      audience: ${OIDC_AUDIENCE:}
      mcp-resource-uri: ${OIDC_MCP_RESOURCE_URI:}
  related-papers:
    hybrid:
      enabled: ${RELATED_PAPERS_HYBRID_ENABLED:false}
      candidate-pool-size: ${RELATED_PAPERS_HYBRID_CANDIDATE_POOL_SIZE:100}
  embedding:
    backfill:
      enabled: ${EMBEDDING_BACKFILL_ENABLED:false}
      profile-key: ${EMBEDDING_BACKFILL_PROFILE_KEY:}
      after-exclusive: ${EMBEDDING_BACKFILL_AFTER_EXCLUSIVE:}
      limit: ${EMBEDDING_BACKFILL_LIMIT:100}
      max-attempts: ${EMBEDDING_BACKFILL_MAX_ATTEMPTS:2}
    ollama:
      enabled: ${OLLAMA_EMBEDDING_ENABLED:false}
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      expected-digest: ${OLLAMA_QWEN3_EMBEDDING_DIGEST:}
      local-only-confirmed: ${OLLAMA_LOCAL_ONLY_CONFIRMED:false}
      connect-timeout: ${OLLAMA_CONNECT_TIMEOUT:2s}
      read-timeout: ${OLLAMA_READ_TIMEOUT:60s}
      keep-alive: ${OLLAMA_KEEP_ALIVE:5m}
  jobs:
    refresh:
      worker-enabled: ${REFRESH_JOBS_WORKER_ENABLED:false}
      scheduled-enqueue-enabled: ${REFRESH_JOBS_SCHEDULED_ENABLED:false}
      poll-delay: ${REFRESH_JOBS_POLL_DELAY:5s}
      scan-delay: ${REFRESH_JOBS_SCAN_DELAY:1h}
      lease-duration: ${REFRESH_JOBS_LEASE_DURATION:2m}
      retry-backoff: ${REFRESH_JOBS_RETRY_BACKOFF:30s}
      max-attempts: ${REFRESH_JOBS_MAX_ATTEMPTS:3}
      jobs-per-poll: ${REFRESH_JOBS_PER_POLL:25}
      stale-targets-per-scan: ${REFRESH_JOBS_STALE_TARGETS_PER_SCAN:100}
  mcp:
    security:
      local-api-key: ${MCP_LOCAL_API_KEY:}
      allowed-origins: ${MCP_ALLOWED_ORIGINS:}
    rate-limit:
      enabled: ${MCP_RATE_LIMIT_ENABLED:true}
      requests-per-window: ${MCP_RATE_LIMIT_REQUESTS:120}
      window: ${MCP_RATE_LIMIT_WINDOW:1m}
      maximum-tracked-clients: ${MCP_RATE_LIMIT_MAX_CLIENTS:10000}
    payload:
      max-request-bytes: ${MCP_MAX_REQUEST_BYTES:1048576}
      max-tool-result-bytes: ${MCP_MAX_TOOL_RESULT_BYTES:1048576}
  access:
    cache-ttl: 24h
    force-refresh-cooldown: 5m
    max-locations-to-verify: 3
    link-verification:
      allow-http: false
      max-redirects: 3
      connect-timeout: 3s
      request-timeout: 10s
      max-probe-bytes: 4096
    providers:
      unpaywall:
        base-url: ${UNPAYWALL_BASE_URL:https://api.unpaywall.org}
        email: ${UNPAYWALL_EMAIL:}
        connect-timeout: 3s
        read-timeout: 15s
      arxiv:
        base-url: ${ARXIV_BASE_URL:https://export.arxiv.org/api}
        connect-timeout: 3s
        read-timeout: 20s
        minimum-request-interval: 3s
  providers:
    openalex:
      base-url: ${OPENALEX_BASE_URL:https://api.openalex.org}
      api-key: ${OPENALEX_API_KEY:}
      connect-timeout: 3s
      request-timeout: ${OPENALEX_REQUEST_TIMEOUT:${OPENALEX_READ_TIMEOUT:${openscholar.providers.openalex.read-timeout:10s}}}
      max-response-bytes: ${OPENALEX_MAX_RESPONSE_BYTES:8388608}
    doaj:
      enabled: ${DOAJ_ENABLED:false}
      base-url: ${DOAJ_BASE_URL:https://doaj.org/api/v4}
      contact-email: ${DOAJ_CONTACT_EMAIL:}
      connect-timeout: ${DOAJ_CONNECT_TIMEOUT:3s}
      request-timeout: ${DOAJ_REQUEST_TIMEOUT:10s}
      max-response-bytes: ${DOAJ_MAX_RESPONSE_BYTES:8388608}
    core:
      enabled: ${CORE_ENABLED:false}
      license-confirmed: ${CORE_LICENSE_CONFIRMED:false}
      base-url: ${CORE_BASE_URL:https://api.core.ac.uk}
      api-key: ${CORE_API_KEY:}
      connect-timeout: ${CORE_CONNECT_TIMEOUT:3s}
      request-timeout: ${CORE_REQUEST_TIMEOUT:10s}
      max-response-bytes: ${CORE_MAX_RESPONSE_BYTES:8388608}
    datacite:
      enabled: ${DATACITE_ENABLED:false}
      base-url: ${DATACITE_BASE_URL:https://api.datacite.org}
      contact-email: ${DATACITE_CONTACT_EMAIL:}
      connect-timeout: ${DATACITE_CONNECT_TIMEOUT:3s}
      request-timeout: ${DATACITE_REQUEST_TIMEOUT:10s}
      max-response-bytes: ${DATACITE_MAX_RESPONSE_BYTES:8388608}
  search:
    cache-ttl: 24h
    coordination-wait-timeout: ${SEARCH_COORDINATION_WAIT_TIMEOUT:12s}
    execution-timeout: ${SEARCH_EXECUTION_TIMEOUT:18s}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        openscholar.mcp.request.duration: true
        openscholar.provider.request.duration: true
        openscholar.refresh.jobs.duration: true
        openscholar.search.duration: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,4s
        openscholar.mcp.request.duration: 100ms,300ms,500ms,1s,4s,10s,20s
        openscholar.provider.request.duration: 100ms,300ms,500ms,1s,4s,8s,12s
        openscholar.refresh.jobs.duration: 1s,4s,10s,30s,1m,5m
        openscholar.search.duration: 100ms,300ms,500ms,1s,4s,10s,20s

info:
  app:
    name: ${spring.application.name}
    description: Open-access research discovery and MCP backend
    java-version: ${java.version}
  mcp:
    transport: stateless-streamable-http
    endpoint: /mcp
    maximum-tested-protocol-version: 2025-11-25
    tool-count: 5
