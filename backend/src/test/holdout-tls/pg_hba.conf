# TLS server policy for the isolated holdout-ledger live integration test.
# Local trust is restricted to the image's bootstrap superuser and exists only
# for initialization/readiness. Every network attempt must negotiate TLS first.
local      all                              postgres                                  trust
local      all                              all                                       reject
hostnossl  all                              all                                       0.0.0.0/0    reject
hostnossl  all                              all                                       ::/0         reject
hostssl    openscholar_holdout_ledger_v1    openscholar_holdout_ledger_runtime_v1      0.0.0.0/0    scram-sha-256
hostssl    openscholar_holdout_ledger_v1    openscholar_holdout_ledger_runtime_v1      ::/0         scram-sha-256
hostssl    all                              all                                       0.0.0.0/0    reject
hostssl    all                              all                                       ::/0         reject
