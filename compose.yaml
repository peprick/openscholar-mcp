name: openscholar

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openscholar}
      POSTGRES_USER: ${POSTGRES_USER:-openscholar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openscholar}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-openscholar}
      POSTGRES_USER: ${POSTGRES_USER:-openscholar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openscholar}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SERVER_ADDRESS: 0.0.0.0
      OIDC_SECURITY_ENABLED: ${OIDC_SECURITY_ENABLED:-false}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_MCP_RESOURCE_URI: ${OIDC_MCP_RESOURCE_URI:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      OPENALEX_BASE_URL: ${OPENALEX_BASE_URL:-https://api.openalex.org}
      OPENALEX_REQUEST_TIMEOUT: ${OPENALEX_REQUEST_TIMEOUT:-${OPENALEX_READ_TIMEOUT:-10s}}
      OPENALEX_MAX_RESPONSE_BYTES: ${OPENALEX_MAX_RESPONSE_BYTES:-8388608}
      DOAJ_ENABLED: ${DOAJ_ENABLED:-false}
      DOAJ_BASE_URL: ${DOAJ_BASE_URL:-https://doaj.org/api/v4}
      DOAJ_CONTACT_EMAIL: ${DOAJ_CONTACT_EMAIL:-}
      DOAJ_CONNECT_TIMEOUT: ${DOAJ_CONNECT_TIMEOUT:-3s}
      DOAJ_REQUEST_TIMEOUT: ${DOAJ_REQUEST_TIMEOUT:-10s}
      DOAJ_MAX_RESPONSE_BYTES: ${DOAJ_MAX_RESPONSE_BYTES:-8388608}
      CORE_ENABLED: ${CORE_ENABLED:-false}
      CORE_LICENSE_CONFIRMED: ${CORE_LICENSE_CONFIRMED:-false}
      CORE_API_KEY: ${CORE_API_KEY:-}
      CORE_BASE_URL: ${CORE_BASE_URL:-https://api.core.ac.uk}
      CORE_CONNECT_TIMEOUT: ${CORE_CONNECT_TIMEOUT:-3s}
      CORE_REQUEST_TIMEOUT: ${CORE_REQUEST_TIMEOUT:-10s}
      CORE_MAX_RESPONSE_BYTES: ${CORE_MAX_RESPONSE_BYTES:-8388608}
      DATACITE_ENABLED: ${DATACITE_ENABLED:-false}
      DATACITE_BASE_URL: ${DATACITE_BASE_URL:-https://api.datacite.org}
      DATACITE_CONTACT_EMAIL: ${DATACITE_CONTACT_EMAIL:-}
      DATACITE_CONNECT_TIMEOUT: ${DATACITE_CONNECT_TIMEOUT:-3s}
      DATACITE_REQUEST_TIMEOUT: ${DATACITE_REQUEST_TIMEOUT:-10s}
      DATACITE_MAX_RESPONSE_BYTES: ${DATACITE_MAX_RESPONSE_BYTES:-8388608}
      SEARCH_COORDINATION_WAIT_TIMEOUT: ${SEARCH_COORDINATION_WAIT_TIMEOUT:-12s}
      SEARCH_EXECUTION_TIMEOUT: ${SEARCH_EXECUTION_TIMEOUT:-18s}
      RELATED_PAPERS_HYBRID_ENABLED: ${RELATED_PAPERS_HYBRID_ENABLED:-false}
      RELATED_PAPERS_HYBRID_CANDIDATE_POOL_SIZE: ${RELATED_PAPERS_HYBRID_CANDIDATE_POOL_SIZE:-100}
      UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-}
      UNPAYWALL_BASE_URL: ${UNPAYWALL_BASE_URL:-https://api.unpaywall.org}
      ARXIV_BASE_URL: ${ARXIV_BASE_URL:-https://export.arxiv.org/api}
      MCP_LOCAL_API_KEY: ${MCP_LOCAL_API_KEY:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      MCP_RATE_LIMIT_ENABLED: ${MCP_RATE_LIMIT_ENABLED:-true}
      MCP_RATE_LIMIT_REQUESTS: ${MCP_RATE_LIMIT_REQUESTS:-120}
      MCP_RATE_LIMIT_WINDOW: ${MCP_RATE_LIMIT_WINDOW:-1m}
      MCP_RATE_LIMIT_MAX_CLIENTS: ${MCP_RATE_LIMIT_MAX_CLIENTS:-10000}
      MCP_MAX_REQUEST_BYTES: ${MCP_MAX_REQUEST_BYTES:-1048576}
      MCP_MAX_TOOL_RESULT_BYTES: ${MCP_MAX_TOOL_RESULT_BYTES:-1048576}
      REFRESH_JOBS_WORKER_ENABLED: ${REFRESH_JOBS_WORKER_ENABLED:-false}
      REFRESH_JOBS_SCHEDULED_ENABLED: ${REFRESH_JOBS_SCHEDULED_ENABLED:-false}
      REFRESH_JOBS_POLL_DELAY: ${REFRESH_JOBS_POLL_DELAY:-5s}
      REFRESH_JOBS_SCAN_DELAY: ${REFRESH_JOBS_SCAN_DELAY:-1h}
      REFRESH_JOBS_LEASE_DURATION: ${REFRESH_JOBS_LEASE_DURATION:-2m}
      REFRESH_JOBS_RETRY_BACKOFF: ${REFRESH_JOBS_RETRY_BACKOFF:-30s}
      REFRESH_JOBS_MAX_ATTEMPTS: ${REFRESH_JOBS_MAX_ATTEMPTS:-3}
      REFRESH_JOBS_PER_POLL: ${REFRESH_JOBS_PER_POLL:-25}
      REFRESH_JOBS_STALE_TARGETS_PER_SCAN: ${REFRESH_JOBS_STALE_TARGETS_PER_SCAN:-100}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      OPENSCHOLAR_API_BASE_URL: http://backend:8080
      OPENSCHOLAR_AUTH_MODE: ${OPENSCHOLAR_AUTH_MODE:-local}
      OPENSCHOLAR_AUTH_SESSION_SECRET: ${OPENSCHOLAR_AUTH_SESSION_SECRET:-}
      OPENSCHOLAR_AUTH_SESSION_MAX_AGE_SECONDS: ${OPENSCHOLAR_AUTH_SESSION_MAX_AGE_SECONDS:-28800}
      OPENSCHOLAR_OIDC_ISSUER: ${OPENSCHOLAR_OIDC_ISSUER:-${OIDC_ISSUER_URI:-}}
      OPENSCHOLAR_OIDC_AUTHORIZATION_ENDPOINT: ${OPENSCHOLAR_OIDC_AUTHORIZATION_ENDPOINT:-}
      OPENSCHOLAR_OIDC_TOKEN_ENDPOINT: ${OPENSCHOLAR_OIDC_TOKEN_ENDPOINT:-}
      OPENSCHOLAR_OIDC_JWKS_URI: ${OPENSCHOLAR_OIDC_JWKS_URI:-${OIDC_JWK_SET_URI:-}}
      OPENSCHOLAR_OIDC_END_SESSION_ENDPOINT: ${OPENSCHOLAR_OIDC_END_SESSION_ENDPOINT:-}
      OPENSCHOLAR_OIDC_CLIENT_ID: ${OPENSCHOLAR_OIDC_CLIENT_ID:-}
      OPENSCHOLAR_OIDC_CLIENT_AUTH_METHOD: ${OPENSCHOLAR_OIDC_CLIENT_AUTH_METHOD:-none}
      OPENSCHOLAR_OIDC_CLIENT_SECRET: ${OPENSCHOLAR_OIDC_CLIENT_SECRET:-}
      OPENSCHOLAR_OIDC_REDIRECT_URI: ${OPENSCHOLAR_OIDC_REDIRECT_URI:-}
      OPENSCHOLAR_OIDC_POST_LOGOUT_REDIRECT_URI: ${OPENSCHOLAR_OIDC_POST_LOGOUT_REDIRECT_URI:-}
      OPENSCHOLAR_OIDC_SCOPES: ${OPENSCHOLAR_OIDC_SCOPES:-openid profile openscholar.search openscholar.library openscholar.jobs openscholar.privacy}
      OPENSCHOLAR_OIDC_ID_TOKEN_ALGS: ${OPENSCHOLAR_OIDC_ID_TOKEN_ALGS:-RS256}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
