global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: openscholar-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:9091"]

  - job_name: openscholar-internal
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://backend:8080/actuator/health/readiness"]
        labels:
          component: backend
      - targets: ["http://frontend:3000/"]
        labels:
          component: frontend
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: openscholar-postgres
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["postgres:5432"]
        labels:
          component: postgres
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: openscholar-public
    metrics_path: /probe
    params:
      module: [https_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/public-endpoints.json
        refresh_interval: 5m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
