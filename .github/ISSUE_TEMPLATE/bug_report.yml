name: Bug report
description: Report a reproducible problem in OpenScholar.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for helping improve OpenScholar. Do not include credentials,
        private documents, personal data, or security vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Commit SHA, branch, or release where the problem occurs.
      placeholder: main or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web interface
        - Backend REST API
        - MCP server
        - Research provider integration
        - Database or migration
        - Docker or deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the problem.
      placeholder: |
        1. Start the stack with ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, Docker, Java, or Node versions that matter.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact credentials, tokens, personal data, and private document content.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, personal data, and private document content.
          required: true
        - label: This is not a security vulnerability.
          required: true
