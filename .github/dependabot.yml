version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Kolkata
    # Pause routine version-update PRs. This limit does not disable default-branch
    # security-update PRs when they are enabled in repository settings.
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    groups:
      java-runtime:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    groups:
      frontend-runtime:
        patterns: ["*"]
        dependency-type: production
        update-types: ["minor", "patch"]
      frontend-development:
        patterns: ["*"]
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /tools/mcp-conformance
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

# The deploy/images Caddy and blackbox-exporter builders pair source tags with
# reviewed checksums and provenance evidence. Update those Dockerfiles manually
# through the supply-chain workflow so an automated tag bump cannot bypass it.
