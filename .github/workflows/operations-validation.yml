name: Operations validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "**/Dockerfile*"
      - "**/*.Dockerfile"
      - "**/*compose*.yml"
      - "**/*compose*.yaml"
      - "backend/.mvn/wrapper/maven-wrapper.properties"
      - "backend/mvnw"
      - "deploy/**"
      - "frontend/docker-entrypoint.sh"
      - "scripts/**/*.sh"
      - "security/**"
      - "tools/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "**/Dockerfile*"
      - "**/*.Dockerfile"
      - "**/*compose*.yml"
      - "**/*compose*.yaml"
      - "backend/.mvn/wrapper/maven-wrapper.properties"
      - "backend/mvnw"
      - "deploy/**"
      - "frontend/docker-entrypoint.sh"
      - "scripts/**/*.sh"
      - "security/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static deployment and recovery guards
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      SHELLCHECK_IMAGE: koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
      PROMETHEUS_VALIDATION_IMAGE: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
      ALERTMANAGER_VALIDATION_IMAGE: prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d

    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate immutable supply-chain references and scan coverage
        run: scripts/validate-supply-chain.sh

      - name: Validate workflows, shell, Compose, edge, and monitoring configuration
        run: scripts/validate-operations.sh

      - name: Exercise PostgreSQL backup and restore guards with fake Docker
        run: scripts/test-postgres-operations.sh

      - name: Exercise resolved production-image policy with fake Docker
        run: scripts/test-production-compose.sh

      - name: Mutation-test supply-chain enforcement
        run: scripts/test-supply-chain-validator.sh
