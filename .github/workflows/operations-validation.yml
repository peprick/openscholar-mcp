name: Operations validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "backend/.mvn/wrapper/maven-wrapper.properties"
      - "backend/Dockerfile"
      - "backend/compose.yaml"
      - "compose.yaml"
      - "deploy/**"
      - "frontend/Dockerfile"
      - "scripts/*.sh"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "backend/.mvn/wrapper/maven-wrapper.properties"
      - "backend/Dockerfile"
      - "backend/compose.yaml"
      - "compose.yaml"
      - "deploy/**"
      - "frontend/Dockerfile"
      - "scripts/*.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static deployment and recovery guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      SHELLCHECK_IMAGE: koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
      CADDY_VALIDATION_IMAGE: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
      PROMETHEUS_VALIDATION_IMAGE: prom/prometheus:v3.5.5@sha256:332c2f43e7e389d74d3893b55bb02fbbd684208e681eeb604641d5d769c0fe2a
      ALERTMANAGER_VALIDATION_IMAGE: prom/alertmanager:v0.32.1@sha256:51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
      BLACKBOX_VALIDATION_IMAGE: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc

    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate immutable supply-chain references and scan coverage
        run: scripts/validate-supply-chain.sh

      - name: Validate workflows, shell, Compose, edge, and monitoring configuration
        run: scripts/validate-operations.sh

      - name: Exercise PostgreSQL backup and restore guards with fake Docker
        run: scripts/test-postgres-operations.sh
