name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "docs/**"
      - ".gitattributes"
      - "LICENSE"
      - "LICENSES/**"
      - "backend/.mvn/wrapper/maven-wrapper.properties"
      - "backend/mvnw"
      - "backend/mvnw.cmd"
      - "**/Dockerfile*"
      - "**/*.Dockerfile"
      - "**/package.json"
      - "backend/pom.xml"
      - "scripts/validate-docs.mjs"
      - "scripts/validate-license-metadata.mjs"
      - "scripts/test-license-metadata.mjs"
      - "scripts/capture-europe-pmc-quality.mjs"
      - "scripts/test-capture-europe-pmc-quality.mjs"
      - "backend/src/test/resources/search/provider-quality/europe-pmc-live-queries-v1.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"
      - ".gitattributes"
      - "LICENSE"
      - "LICENSES/**"
      - "backend/.mvn/wrapper/maven-wrapper.properties"
      - "backend/mvnw"
      - "backend/mvnw.cmd"
      - "**/Dockerfile*"
      - "**/*.Dockerfile"
      - "**/package.json"
      - "backend/pom.xml"
      - "scripts/validate-docs.mjs"
      - "scripts/validate-license-metadata.mjs"
      - "scripts/test-license-metadata.mjs"
      - "scripts/capture-europe-pmc-quality.mjs"
      - "scripts/test-capture-europe-pmc-quality.mjs"
      - "backend/src/test/resources/search/provider-quality/europe-pmc-live-queries-v1.json"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Docs and capture checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Validate local documentation links
        run: node scripts/validate-docs.mjs

      - name: Validate repository licensing metadata
        run: node scripts/validate-license-metadata.mjs

      - name: Mutation-test repository licensing metadata
        run: node scripts/test-license-metadata.mjs

      - name: Validate provider-quality capture utility
        run: node scripts/capture-europe-pmc-quality.mjs --validate-query-set

      - name: Exercise provider-quality capture utility
        run: node scripts/test-capture-europe-pmc-quality.mjs
