name: Release runtime images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable semantic release label (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate protected release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Check out complete source history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate repository, ref, and stable release label
        id: release
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "peprick/openscholar-mcp" ]]; then
            echo "Image publication is restricted to peprick/openscholar-mcp." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_PROTECTED:-false}" != "true" ]]; then
            echo "Image publication requires a protected branch or tag ref." >&2
            exit 1
          fi

          case "${GITHUB_EVENT_NAME}" in
            push)
              [[ "${GITHUB_REF}" == refs/tags/* ]] || {
                echo "Automatic releases require a tag ref." >&2
                exit 1
              }
              release_tag="${GITHUB_REF_NAME}"
              ;;
            workflow_dispatch)
              [[ "${GITHUB_REF}" == "refs/tags/${DISPATCH_RELEASE_TAG}" ]] || {
                echo "Manual retries must be dispatched from the exact release tag." >&2
                exit 1
              }
              release_tag="${DISPATCH_RELEASE_TAG}"
              ;;
            *)
              echo "Unsupported release event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          if [[ ! "${release_tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "The release label must be an exact stable vMAJOR.MINOR.PATCH value." >&2
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/${release_tag}^{commit}")" || {
            echo "The validated release tag must exist in the fetched source history." >&2
            exit 1
          }
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "The release tag must identify the exact workflow source commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "The release source must be reachable from origin/main." >&2
            exit 1
          fi

          printf 'release_tag=%s\n' "${release_tag}" >>"${GITHUB_OUTPUT}"
          printf 'image_tag=sha-%s\n' "${GITHUB_SHA}" >>"${GITHUB_OUTPUT}"

  backend:
    name: Release backend image
    needs: validate-release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/release-one-image.yml
    with:
      image_key: backend
      image_tag: ${{ needs.validate-release.outputs.image_tag }}
      release_tag: ${{ needs.validate-release.outputs.release_tag }}

  frontend:
    name: Release frontend image
    needs: validate-release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/release-one-image.yml
    with:
      image_key: frontend
      image_tag: ${{ needs.validate-release.outputs.image_tag }}
      release_tag: ${{ needs.validate-release.outputs.release_tag }}

  caddy:
    name: Release Caddy image
    needs: validate-release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/release-one-image.yml
    with:
      image_key: caddy
      image_tag: ${{ needs.validate-release.outputs.image_tag }}
      release_tag: ${{ needs.validate-release.outputs.release_tag }}

  blackbox-exporter:
    name: Release blackbox-exporter image
    needs: validate-release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/release-one-image.yml
    with:
      image_key: blackbox-exporter
      image_tag: ${{ needs.validate-release.outputs.image_tag }}
      release_tag: ${{ needs.validate-release.outputs.release_tag }}

  release-manifest:
    name: Assemble deployment references
    needs:
      - validate-release
      - backend
      - frontend
      - caddy
      - blackbox-exporter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Create the reviewed production-environment fragment
        env:
          BACKEND_REF: ${{ needs.backend.outputs.deployment_ref }}
          BLACKBOX_EXPORTER_REF: ${{ needs.blackbox-exporter.outputs.deployment_ref }}
          CADDY_REF: ${{ needs.caddy.outputs.deployment_ref }}
          FRONTEND_REF: ${{ needs.frontend.outputs.deployment_ref }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p release-output
          validate_ref() {
            local variable="$1"
            local repository="$2"
            local value="$3"
            local expected_prefix="${repository}:sha-${SOURCE_SHA}@"
            local digest="${value#"${expected_prefix}"}"
            if [[ "${value}" != "${expected_prefix}"* \
              || ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "${variable} returned an invalid or cross-wired deployment reference." >&2
              exit 1
            fi
          }
          validate_ref BACKEND_IMAGE ghcr.io/peprick/openscholar-backend "${BACKEND_REF}"
          validate_ref FRONTEND_IMAGE ghcr.io/peprick/openscholar-frontend "${FRONTEND_REF}"
          validate_ref CADDY_IMAGE ghcr.io/peprick/openscholar-caddy "${CADDY_REF}"
          validate_ref BLACKBOX_EXPORTER_IMAGE ghcr.io/peprick/openscholar-blackbox-exporter "${BLACKBOX_EXPORTER_REF}"
          {
            printf '# OpenScholar runtime images for %s (%s)\n' "${RELEASE_TAG}" "${SOURCE_SHA}"
            printf '# Review every digest and its retained evidence before manual promotion.\n'
            printf 'BACKEND_IMAGE=%s\n' "${BACKEND_REF}"
            printf 'FRONTEND_IMAGE=%s\n' "${FRONTEND_REF}"
            printf 'CADDY_IMAGE=%s\n' "${CADDY_REF}"
            printf 'BLACKBOX_EXPORTER_IMAGE=%s\n' "${BLACKBOX_EXPORTER_REF}"
          } >release-output/release-images.env

      - name: Retain the digest-pinned deployment fragment
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-images-${{ needs.validate-release.outputs.release_tag }}-${{ github.run_attempt }}
          path: release-output/release-images.env
          if-no-files-found: error
          retention-days: 90
