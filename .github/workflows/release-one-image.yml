name: Release one runtime image

on:
  workflow_call:
    inputs:
      image_key:
        description: Closed image identifier mapped inside this workflow
        required: true
        type: string
      image_tag:
        description: Source-SHA image tag generated by the caller
        required: true
        type: string
      release_tag:
        description: Validated stable semantic release label
        required: true
        type: string
    outputs:
      deployment_ref:
        description: Published tag plus immutable registry digest
        value: ${{ jobs.release.outputs.deployment_ref }}

permissions: {}

jobs:
  release:
    name: Build, scan, sign, and attest ${{ inputs.image_key }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: image-release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      DOCKER_BUILDKIT: "1"
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      TRIVY_PLATFORM: linux/amd64
    outputs:
      deployment_ref: ${{ steps.approve.outputs.deployment_ref }}
    steps:
      - name: Validate the closed release request and prepare evidence
        id: request
        env:
          IMAGE_KEY: ${{ inputs.image_key }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "peprick/openscholar-mcp" \
            || "${GITHUB_REF_PROTECTED:-false}" != "true" ]]; then
            echo "Image publication requires the canonical repository and a protected ref." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ \
            || "${GITHUB_REF}" != "refs/tags/${RELEASE_TAG}" ]]; then
            echo "The release must run on its exact protected stable tag." >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" != "push" \
            && "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "Only a stable-tag push or explicit stable-tag retry may publish images." >&2
            exit 1
          fi
          expected_caller="${GITHUB_REPOSITORY}/.github/workflows/release-images.yml@${GITHUB_REF}"
          if [[ "${GITHUB_WORKFLOW_REF}" != "${expected_caller}" ]]; then
            echo "Only the reviewed release-images workflow may call this worker." >&2
            exit 1
          fi
          if [[ "${IMAGE_TAG}" != "sha-${GITHUB_SHA}" ]]; then
            echo "The image tag must identify the exact source SHA." >&2
            exit 1
          fi

          case "${IMAGE_KEY}" in
            backend|frontend|caddy|blackbox-exporter)
              evidence_dir="release-evidence/${IMAGE_KEY}"
              ;;
            *)
              echo "Unsupported release image: ${IMAGE_KEY}" >&2
              exit 1
              ;;
          esac

          mkdir -p "${evidence_dir}"
          {
            printf 'repository=%s\n' "${GITHUB_REPOSITORY}"
            printf 'source_sha=%s\n' "${GITHUB_SHA}"
            printf 'release_tag=%s\n' "${RELEASE_TAG}"
            printf 'image_key=%s\n' "${IMAGE_KEY}"
            printf 'caller_workflow_ref=%s\n' "${GITHUB_WORKFLOW_REF}"
            printf 'run_id=%s\n' "${GITHUB_RUN_ID}"
            printf 'run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
          } >"${evidence_dir}/release-metadata.txt"
          {
            printf 'artifact_name=release-%s-evidence-%s\n' "${IMAGE_KEY}" "${GITHUB_RUN_ATTEMPT}"
            printf 'evidence_dir=%s\n' "${evidence_dir}"
          } >>"${GITHUB_OUTPUT}"

      - name: Require deliberate release-environment enablement
        env:
          IMAGE_RELEASE_ENABLED: ${{ vars.IMAGE_RELEASE_ENABLED }}
        run: |
          set -Eeuo pipefail
          if [[ "${IMAGE_RELEASE_ENABLED}" != "true" ]]; then
            echo "The protected image-release environment must define IMAGE_RELEASE_ENABLED=true." >&2
            exit 1
          fi

      - name: Check out the exact release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve the closed image policy
        id: image
        env:
          EVIDENCE_DIR: ${{ steps.request.outputs.evidence_dir }}
          IMAGE_KEY: ${{ inputs.image_key }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" || {
            echo "The validated release tag is absent from the fetched source history." >&2
            exit 1
          }
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "The release tag must identify the exact worker source commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "The release source must be reachable from origin/main." >&2
            exit 1
          fi

          case "${IMAGE_KEY}" in
            backend)
              context=backend
              dockerfile=backend/Dockerfile
              repository=ghcr.io/peprick/openscholar-backend
              ;;
            frontend)
              context=frontend
              dockerfile=frontend/Dockerfile
              repository=ghcr.io/peprick/openscholar-frontend
              ;;
            caddy)
              context=deploy/images/caddy
              dockerfile=deploy/images/caddy/Dockerfile
              repository=ghcr.io/peprick/openscholar-caddy
              ;;
            blackbox-exporter)
              context=deploy/images/blackbox-exporter
              dockerfile=deploy/images/blackbox-exporter/Dockerfile
              repository=ghcr.io/peprick/openscholar-blackbox-exporter
              ;;
            *)
              echo "Unsupported release image: ${IMAGE_KEY}" >&2
              exit 1
              ;;
          esac

          {
            printf 'context=%s\n' "${context}"
            printf 'dockerfile=%s\n' "${dockerfile}"
            printf 'evidence_dir=%s\n' "${EVIDENCE_DIR}"
            printf 'local_ref=openscholar-release/%s:%s\n' "${IMAGE_KEY}" "${GITHUB_SHA}"
            printf 'published_ref=%s:%s\n' "${repository}" "${IMAGE_TAG}"
            printf 'repository=%s\n' "${repository}"
          } >>"${GITHUB_OUTPUT}"

      - name: Build the final linux/amd64 runtime once
        env:
          BUILD_CONTEXT: ${{ steps.image.outputs.context }}
          DOCKERFILE: ${{ steps.image.outputs.dockerfile }}
          LOCAL_REF: ${{ steps.image.outputs.local_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          docker build --pull \
            --platform linux/amd64 \
            --file "${DOCKERFILE}" \
            --label "io.github.peprick.openscholar.release=${RELEASE_TAG}" \
            --label "io.github.peprick.openscholar.source-revision=${GITHUB_SHA}" \
            --tag "${LOCAL_REF}" \
            "${BUILD_CONTEXT}"

      - name: Generate the local image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.local_ref }}
          format: cyclonedx
          output: ${{ steps.image.outputs.evidence_dir }}/image.cdx.json

      - name: Enforce the local high and critical vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.local_ref }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          limit-severities-for-sarif: true
          output: ${{ steps.image.outputs.evidence_dir }}/local-image.sarif
          exit-code: "1"

      - name: Authenticate to the reviewed GHCR namespace
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish once and capture the returned registry digest
        id: publish
        env:
          EVIDENCE_DIR: ${{ steps.image.outputs.evidence_dir }}
          LOCAL_REF: ${{ steps.image.outputs.local_ref }}
          PUBLISHED_REF: ${{ steps.image.outputs.published_ref }}
          REPOSITORY: ${{ steps.image.outputs.repository }}
        run: |
          set -Eeuo pipefail
          docker tag "${LOCAL_REF}" "${PUBLISHED_REF}"
          docker push "${PUBLISHED_REF}"

          digest_ref="$({
            docker image inspect \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "${PUBLISHED_REF}"
          } | awk -v prefix="${REPOSITORY}@sha256:" 'index($0, prefix) == 1 { print; exit }')"
          if [[ "${digest_ref}" != "${REPOSITORY}@sha256:"* ]]; then
            echo "Docker did not return the expected repository digest." >&2
            exit 1
          fi
          subject_digest="${digest_ref#*@}"
          if [[ ! "${subject_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The registry returned an invalid image digest." >&2
            exit 1
          fi
          deployment_ref="${PUBLISHED_REF}@${subject_digest}"

          printf '%s\n' "${digest_ref}" >"${EVIDENCE_DIR}/registry-digest.txt"
          printf '%s\n' "${deployment_ref}" >"${EVIDENCE_DIR}/deployment-reference.txt"
          {
            printf 'deployment_ref=%s\n' "${deployment_ref}"
            printf 'digest_ref=%s\n' "${digest_ref}"
            printf 'subject_digest=%s\n' "${subject_digest}"
          } >>"${GITHUB_OUTPUT}"

      - name: Pull and verify the exact published digest
        env:
          DIGEST_REF: ${{ steps.publish.outputs.digest_ref }}
          EVIDENCE_DIR: ${{ steps.image.outputs.evidence_dir }}
        run: |
          set -Eeuo pipefail
          docker pull --platform linux/amd64 "${DIGEST_REF}"
          operating_system="$(docker image inspect --format '{{.Os}}' "${DIGEST_REF}")"
          architecture="$(docker image inspect --format '{{.Architecture}}' "${DIGEST_REF}")"
          source_revision="$(docker image inspect \
            --format '{{index .Config.Labels "io.github.peprick.openscholar.source-revision"}}' \
            "${DIGEST_REF}")"
          if [[ "${operating_system}/${architecture}" != "linux/amd64" \
            || "${source_revision}" != "${GITHUB_SHA}" ]]; then
            echo "The published digest does not match the reviewed platform and source." >&2
            exit 1
          fi
          printf 'platform=%s/%s\nsource_revision=%s\n' \
            "${operating_system}" "${architecture}" "${source_revision}" \
            >"${EVIDENCE_DIR}/registry-inspection.txt"

      - name: Rescan the exact returned registry digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.publish.outputs.digest_ref }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          limit-severities-for-sarif: true
          output: ${{ steps.image.outputs.evidence_dir }}/registry-image.sarif
          exit-code: "1"

      - name: Retain the unfiltered registry vulnerability review
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.publish.outputs.digest_ref }}
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: ${{ steps.image.outputs.evidence_dir }}/registry-vulnerabilities.json
          exit-code: "0"

      - name: Install the reviewed Cosign release
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Keylessly sign and verify the exact registry digest
        env:
          DIGEST_REF: ${{ steps.publish.outputs.digest_ref }}
          EVIDENCE_DIR: ${{ steps.image.outputs.evidence_dir }}
        run: |
          set -Eeuo pipefail
          cosign sign --yes "${DIGEST_REF}"
          identity_regexp="^https://github.com/peprick/openscholar-mcp/\\.github/workflows/release-one-image\\.yml@refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+$"
          cosign verify \
            --certificate-identity-regexp "${identity_regexp}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --output json \
            "${DIGEST_REF}" >"${EVIDENCE_DIR}/cosign-verification.json"

      - name: Publish signed build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.publish.outputs.subject_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Publish the signed CycloneDX SBOM attestation
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.publish.outputs.subject_digest }}
          sbom-path: ${{ steps.image.outputs.evidence_dir }}/image.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Retain attestation bundles with the scan evidence
        env:
          EVIDENCE_DIR: ${{ steps.image.outputs.evidence_dir }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          set -Eeuo pipefail
          cp -- "${PROVENANCE_BUNDLE}" "${EVIDENCE_DIR}/provenance.bundle.json"
          cp -- "${SBOM_BUNDLE}" "${EVIDENCE_DIR}/sbom.bundle.json"

      - name: Retain release evidence
        if: always() && steps.request.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.request.outputs.artifact_name }}
          path: ${{ steps.request.outputs.evidence_dir }}/
          if-no-files-found: error
          retention-days: 90

      - name: Expose the deployment reference only after complete success
        id: approve
        env:
          DEPLOYMENT_REF: ${{ steps.publish.outputs.deployment_ref }}
        run: |
          set -Eeuo pipefail
          if [[ ! "${DEPLOYMENT_REF}" =~ ^ghcr\.io/peprick/openscholar-[a-z-]+:sha-${GITHUB_SHA}@sha256:[0-9a-f]{64}$ ]]; then
            echo "The completed release did not produce a valid deployment reference." >&2
            exit 1
          fi
          printf 'deployment_ref=%s\n' "${DEPLOYMENT_REF}" >>"${GITHUB_OUTPUT}"
